name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache vendored OpenSSL + OpenLDAP
        uses: actions/cache@v4
        with:
          path: |
            deps/macos
            deps/.build-macos/dl
          key: deps-macos-${{ hashFiles('deps.lock', 'scripts/build-deps-macos.sh') }}
      - name: Build vendored dependencies (universal, pinned)
        run: scripts/build-deps-macos.sh
      - name: Unit tests
        run: cargo test --locked
      - name: Universal build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          lipo -create -output ldap target/aarch64-apple-darwin/release/ldap target/x86_64-apple-darwin/release/ldap
          lipo -info ldap
          otool -L ldap
      - name: Integration tests against a local slapd
        run: |
          brew install openldap krb5
          tests/integration/macos.sh "$PWD/ldap"
          bash tests/integration/kerberos-macos.sh "$PWD/ldap"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Unit tests
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          B=target/${{ matrix.target }}/release/ldap.exe
          "$B" --version
          "$B" escape filter 'a*(b)'
          # NTLM is accepted on Windows (fails later on connect, not at option validation).
          rc=0; "$B" -H ldaps://127.0.0.1:1 -M ntlm --connect-timeout 1 whoami || rc=$?
          test "$rc" -eq 3
